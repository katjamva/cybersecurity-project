{% extends "polls/base.html" %}

{% block extra_head %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'polls/style.css' %}">
{% endblock %}

{% block content %}
    <h2>New poll</h2>
    {% if error_message %}<p><strong>{{ error_message }}</strong></p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <p>
            <label for="question_text">Question:</label><br>
            <input type="text" id="question_text" name="question_text" maxlength="200">
        </p>
        <p>
            <label for="choices">Choices (one per line, at least two):</label><br>
            <textarea id="choices" name="choices" rows="5" cols="40"></textarea>
        </p>
        <button type="submit">Create your poll</button>
    </form>

<div class="back-link">
    <a href="{% url 'polls:index' %}">Back to polls</a>
</div>
{% endblock %}
